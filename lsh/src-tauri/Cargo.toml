[package]
name = "local-service-hub"
version = "0.1.0"
description = "LSH — 本地自托管 AI 服务的语义级控制中心"
authors = ["Jindy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lsh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# V0.1 能力层保持精简：只做进程/端口扫描与 manifest 加载。
# pty 走 macOS 自带 /usr/bin/script，不引入 portable-pty。
# sqlite / 事件流留到 V0.2。
# tray-icon：菜单栏常驻；image-png：动态切换托盘图标（from_bytes 解码 PNG）
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
