<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 晨报 · 2026 年 8 月 9 日</title>
<style>
  :root{
    --bg:#0b0e14;
    --bg-soft:#121724;
    --panel:#151b2b;
    --panel-2:#1b2236;
    --border:#26304a;
    --border-soft:#1f2740;
    --text:#e8ecf5;
    --text-dim:#9aa6c0;
    --text-mute:#6b7796;
    --accent:#6ea8ff;
    --accent-2:#8b7bff;
    --c-model:#ff9f43;
    --c-product:#4cc9f0;
    --c-industry:#5fd06a;
    --c-paper:#f06595;
    --c-tip:#b794f6;
    --radius:14px;
    --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:120px}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,rgba(110,168,255,.10),transparent 60%),
               radial-gradient(900px 500px at -10% 10%,rgba(139,123,255,.10),transparent 55%),
               var(--bg);
    color:var(--text);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}

  /* Hero */
  .hero{
    margin-top:28px;padding:34px 30px;border-radius:20px;
    background:linear-gradient(135deg,rgba(110,168,255,.12),rgba(139,123,255,.10) 60%,rgba(21,27,43,.6));
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(600px 200px at 90% 0%,rgba(110,168,255,.18),transparent 70%);
    pointer-events:none;
  }
  .hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;position:relative}
  .hero-eyebrow{font-size:13px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;font-weight:600}
  .hero-date{font-size:30px;font-weight:800;letter-spacing:.5px;margin-top:6px}
  .hero-date .dim{color:var(--text-dim);font-weight:600}
  .hero-meta{font-size:13.5px;color:var(--text-dim);margin-top:8px}
  .hero-meta b{color:var(--text)}
  .hero-total{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:96px;padding:14px 18px;border-radius:14px;
    background:rgba(110,168,255,.12);border:1px solid rgba(110,168,255,.35);
  }
  .hero-total .num{font-size:30px;font-weight:800;color:var(--accent);line-height:1}
  .hero-total .lbl{font-size:12px;color:var(--text-dim);margin-top:4px}

  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:26px;position:relative}
  .stat{
    padding:14px 14px;border-radius:12px;background:var(--panel);
    border:1px solid var(--border-soft);transition:transform .15s ease,border-color .15s ease;
  }
  .stat:hover{transform:translateY(-2px)}
  .stat .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
  .stat .name{font-size:13px;color:var(--text-dim);font-weight:500}
  .stat .cnt{font-size:22px;font-weight:800;margin-top:6px}
  .stat.zero .cnt{color:var(--text-mute)}
  .stat.zero .name{color:var(--text-mute)}

  /* Nav */
  nav.anchor{
    position:sticky;top:0;z-index:50;margin:24px -20px 0;padding:12px 20px;
    background:rgba(11,14,20,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border-soft);
    display:flex;gap:8px;overflow-x:auto;align-items:center;
  }
  nav.anchor a{
    white-space:nowrap;padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;
    color:var(--text-dim);border:1px solid var(--border-soft);background:var(--panel);
    transition:all .15s ease;display:inline-flex;align-items:center;gap:7px;
  }
  nav.anchor a:hover{color:var(--text);border-color:var(--border)}
  nav.anchor a .mini{font-size:11px;color:var(--text-mute);font-weight:700}
  nav.anchor a.active{color:#0b0e14;background:var(--accent);border-color:var(--accent)}
  nav.anchor a.active .mini{color:rgba(11,14,20,.65)}

  /* Section */
  section.block{margin-top:38px;scroll-margin-top:110px}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border-soft)}
  .sec-bar{width:4px;height:22px;border-radius:3px}
  .sec-title{font-size:20px;font-weight:800}
  .sec-count{font-size:13px;color:var(--text-dim);font-weight:600;background:var(--panel);padding:3px 10px;border-radius:999px;border:1px solid var(--border-soft)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}

  /* Card */
  article.card{
    position:relative;display:flex;flex-direction:column;
    padding:18px 18px 16px;border-radius:var(--radius);
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--border-soft);
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  article.card:hover{transform:translateY(-3px);border-color:var(--border);box-shadow:var(--shadow)}
  .card-num{
    position:absolute;top:14px;right:16px;font-size:13px;font-weight:800;color:var(--text-mute);
    font-variant-numeric:tabular-nums;letter-spacing:.04em;
  }
  .card-src{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    color:var(--text-dim);background:rgba(110,168,255,.10);border:1px solid rgba(110,168,255,.22);
    padding:3px 9px;border-radius:999px;align-self:flex-start;max-width:100%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card-src .ico{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
  .card-title{
    font-size:16px;font-weight:700;line-height:1.45;margin-top:11px;color:var(--text);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-title:hover{color:var(--accent)}
  .card-sum{font-size:13.5px;color:var(--text-dim);line-height:1.6;margin-top:10px;flex:1}
  .card-cta{
    margin-top:14px;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:700;color:var(--accent);padding:6px 12px;border-radius:8px;
    border:1px solid rgba(110,168,255,.3);background:rgba(110,168,255,.06);transition:all .15s ease;
  }
  .card-cta:hover{background:rgba(110,168,255,.16);border-color:var(--accent)}
  .card-cta svg{width:13px;height:13px}

  /* Empty */
  .empty{
    padding:34px 20px;border-radius:var(--radius);border:1px dashed var(--border-soft);
    background:rgba(21,27,43,.4);text-align:center;color:var(--text-mute);font-size:14px;
  }
  .empty .ico{font-size:22px;display:block;margin-bottom:8px;opacity:.7}

  /* Footer */
  footer{
    margin-top:48px;padding:24px 20px;border-top:1px solid var(--border-soft);
    display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
    color:var(--text-mute);font-size:13px;
  }
  footer b{color:var(--text-dim)}
  footer a{color:var(--accent);font-weight:600}
  footer a:hover{text-decoration:underline}

  @media(max-width:760px){
    .hero{padding:24px 20px}
    .hero-date{font-size:24px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .grid{grid-template-columns:1fr}
    .hero-top{flex-direction:column}
    .hero-total{align-self:flex-start;flex-direction:row;gap:10px;min-width:0}
  }
  @media(max-width:420px){
    .stats{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-eyebrow">AI 晨报 · AIHOT 日报</div>
        <div class="hero-date">2026 年 8 月 9 日 <span class="dim">星期日</span></div>
        <div class="hero-meta">
          数据窗口：<b>8 月 8 日 08:00 — 8 月 9 日 08:00</b>（北京时间）<br>
          日报生成：<b>8 月 9 日 08:01</b>（北京时间）· 共 <b id="heroTotal">6</b> 条精选
        </div>
      </div>
      <div class="hero-total">
        <span class="num" id="heroBig">6</span>
        <span class="lbl">条精选</span>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="anchor" id="nav"></nav>
  <main id="main"></main>

  <footer>
    <span>本仪表盘共展示 <b id="footTotal">6</b> 条精选资讯</span>
    <span>数据源：<a href="https://aihot.virxact.com/daily/2026-08-09" target="_blank" rel="noopener noreferrer">AIHOT 日报 · 2026-08-09</a> · 由 AI HOT v1 API 提供</span>
  </footer>
</div>

<script>
const REPORT = {
  date: "2026-08-09",
  generatedAt: "2026-08-09T00:01:00.653Z",
  windowStart: "2026-08-08T00:00:00.000Z",
  windowEnd: "2026-08-09T00:00:00.000Z",
  link: "https://aihot.virxact.com/daily/2026-08-09"
};

// 五个固定版块（顺序固定，全局连续编号）
const SECTIONS = [
  { key:"model",   label:"模型发布/更新", color:"#ff9f43" },
  { key:"product", label:"产品发布/更新", color:"#4cc9f0" },
  { key:"industry",label:"行业动态",     color:"#5fd06a" },
  { key:"paper",   label:"论文研究",     color:"#f06595" },
  { key:"tip",     label:"技巧与观点",   color:"#b794f6" }
];

// 日报条目按版块归类（今日日报编辑已分组，此处映射到固定版块）
const BUCKETS = {
  product: [
    { title:"苹果 Mac 简体中文支持文档更新，“Apple 智能”阿里千问扩展现身",
      summary:"苹果官网 Mac 简体中文使用手册新增《在 Mac 上配合 Apple 智能使用千问》支持文档，明确 Apple 智能可配合阿里巴巴千问模型工作。千问扩展适用于 macOS 26.6 或更高版本，需中国大陆 Apple 账户及机型，支持写作工具与 Siri，用户需登录千问账户使用。",
      source:"IT之家（RSS）",
      link:"https://www.ithome.com/0/987/366.htm" },
    { title:"OpenAI 桌面端 ChatGPT 上线语音交互功能，可语音操控电脑执行多步骤任务",
      summary:"OpenAI 更新 ChatGPT 桌面应用，新增对 ChatGPT Voice 的支持，用户可直接通过语音对话控制 AI 智能体并让其在电脑上执行任务。该功能基于全新语音模型系列 ChatGPT-Live，支持 ChatGPT Work 和 Codex，在 macOS 上还可借助 Appshots 访问屏幕内容。",
      source:"IT之家（RSS）",
      link:"https://www.ithome.com/0/987/452.htm" },
    { title:"Grok Imagine 图像编辑迎来重大升级",
      summary:"Grok Imagine 图像编辑功能重大升级：你可以直接悬停在 Grok Imagine 中的任意特定区域，并即时进行编辑。",
      source:"X：Elon Musk (@elonmusk, xAI)",
      link:"https://x.com/elonmusk/status/2086127247077843282" },
    { title:"Claude Code v2.1.225 发布：新增网关支出限额支持与工作区信任提示",
      summary:"Claude Code v2.1.225 为用量警告新增网关支出限额支持，达到限额时提示将显示上限、重置时间及操作者消息。该版本还为不受信任目录中的 claude agents 增加工作区信任提示，并修复了 MCP OAuth 服务器在 macOS 上的间歇性 401 错误、跨会话消息滞留及 Remote Control 会话恢复后对话历史损坏等问题。",
      source:"Claude Code：GitHub Releases（RSS）",
      link:"https://github.com/anthropics/claude-code/releases/tag/v2.1.225" }
  ],
  industry: [
    { title:"Cloudflare：AI 机器人流量已超越人类，预计五年后人机流量比达 1:1000 近乎“误差”",
      summary:"Cloudflare 在 2026 年第二季度财报电话会议上披露，AI 机器人等非人类流量已于 2026 年 5 月正式超过人类流量，比 CEO 此前预测的 2027 年底大幅提前。公司预测若趋势延续，五年后非人类流量将达人类流量的 1000 倍，人类在互联网上的存在将变得微不足道。该季度营收 6.96 亿美元，同比增长 36%，净亏损 2.057 亿美元。",
      source:"IT之家（RSS）",
      link:"https://www.ithome.com/0/987/438.htm" },
    { title:"Firebird 在亚美尼亚启动独联体地区最大 AI 工厂",
      summary:"Firebird 在亚美尼亚启动独联体地区最大 AI 工厂，由 NVIDIA 加速计算和 Dell Technologies 基础设施驱动，亚美尼亚总理等官员出席开幕式。",
      source:"NVIDIA Blog（RSS）",
      link:"https://blogs.nvidia.com/blog/firebird-ai-factory-armenia-blackwell-rubin-dsx" }
  ],
  model: [],
  paper: [],
  tip: []
};

// 截断到 ≤60 个字符（中文按字符计）
function trunc(s){
  if(!s) return "";
  const max=60;
  let out="";
  let n=0;
  for(const ch of s){
    out+=ch; n++;
    if(n>=max) break;
  }
  if(s.length>max) out+="…";
  return out;
}

const extIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>';

// 统计
const counts = SECTIONS.map(s => (BUCKETS[s.key]||[]).length);
const total = counts.reduce((a,b)=>a+b,0);
document.getElementById('heroTotal').textContent = total;
document.getElementById('heroBig').textContent = total;
document.getElementById('footTotal').textContent = total;

// 渲染统计
const statsEl = document.getElementById('stats');
SECTIONS.forEach((s,i)=>{
  const c = counts[i];
  const el = document.createElement('div');
  el.className = 'stat' + (c===0?' zero':'');
  el.innerHTML = `<span class="name"><span class="dot" style="background:${s.color}"></span>${s.label}</span><div class="cnt">${c}</div>`;
  statsEl.appendChild(el);
});

// 渲染锚点导航
const navEl = document.getElementById('nav');
SECTIONS.forEach((s,i)=>{
  const a = document.createElement('a');
  a.href = '#sec-'+s.key;
  a.dataset.key = s.key;
  a.innerHTML = `<span style="width:8px;height:8px;border-radius:50%;background:${s.color};display:inline-block"></span>${s.label}<span class="mini">${counts[i]}</span>`;
  navEl.appendChild(a);
});

// 渲染正文
const mainEl = document.getElementById('main');
let globalIdx = 0;
SECTIONS.forEach((s)=>{
  const items = BUCKETS[s.key]||[];
  const sec = document.createElement('section');
  sec.className = 'block';
  sec.id = 'sec-'+s.key;
  let inner = `<div class="sec-head">
    <span class="sec-bar" style="background:${s.color}"></span>
    <span class="sec-title">${s.label}</span>
    <span class="sec-count">${items.length} 条</span>
  </div>`;
  if(items.length===0){
    inner += `<div class="empty"><span class="ico">○</span>本版块今日暂无精选条目</div>`;
  }else{
    inner += '<div class="grid">';
    items.forEach(it=>{
      globalIdx++;
      const n = String(globalIdx).padStart(2,'0');
      const card = `<article class="card">
        <span class="card-num">${n}</span>
        <span class="card-src"><span class="ico"></span>${escapeHtml(it.source)}</span>
        <a class="card-title" href="${it.link}" target="_blank" rel="noopener noreferrer">${escapeHtml(it.title)}</a>
        <p class="card-sum">${escapeHtml(trunc(it.summary))}</p>
        <a class="card-cta" href="${it.link}" target="_blank" rel="noopener noreferrer">查看原文 ${extIcon}</a>
      </article>`;
      inner += card;
    });
    inner += '</div>';
  }
  sec.innerHTML = inner;
  mainEl.appendChild(sec);
});

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

// 导航高亮（滚动联动）
const navLinks = [...navEl.querySelectorAll('a')];
const sections = SECTIONS.map(s=>document.getElementById('sec-'+s.key));
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const key = e.target.id.replace('sec-','');
      navLinks.forEach(l=>l.classList.toggle('active', l.dataset.key===key));
    }
  });
},{rootMargin:'-110px 0px -60% 0px',threshold:0});
sections.forEach(s=>s && io.observe(s));
navLinks[0] && navLinks[0].classList.add('active');
</script>
</body>
</html>
